name: CI

on:
  push:
    branches: [main, "claude/**", "rom"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: build · vet · race tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.5"
      - name: Build
        run: go build ./xcrypto/... ./xfileformats/... ./xcrack/...
      - name: Vet
        run: go vet ./xcrypto/... ./xfileformats/... ./xcrack/...
      - name: Gofmt (check)
        run: |
          out=$(gofmt -l xcrypto xfileformats xcrack)
          if [ -n "$out" ]; then echo "unformatted files:"; echo "$out"; exit 1; fi
      - name: Test (race)
        # Also replays committed fuzz seed corpora, including regression crashers.
        run: go test -race ./xcrypto/... ./xfileformats/... ./xcrack/...
      - name: govulncheck
        # Reports known vulnerabilities; non-blocking so CI does not fail on a
        # transient advisory or vuln-DB availability.
        continue-on-error: true
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          for m in xcrypto xfileformats xcrack; do (cd "$m" && "$(go env GOPATH)/bin/govulncheck" ./...); done

  fuzz:
    name: fuzz (bounded smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.5"
      - name: Fuzz each target briefly
        run: ./scripts/fuzz.sh 25s
